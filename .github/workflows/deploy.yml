name: Deploy CARENTO Front

on:
  push:
    branches:
    - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Prepare SSH key
      run: |
        echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > "${{ github.workspace }}/deploy_key"
        chmod 644 "${{ github.workspace }}/deploy_key"

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key_path: ${{ github.workspace }}/deploy_key
        script: |
          set -e
          cd /home/carento-project/CARENTO-FRONT
          git fetch --all
          git reset --hard origin/master
          sh deploy.sh
          docker restart carento-front
